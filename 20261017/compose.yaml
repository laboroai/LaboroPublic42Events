services:
  app:
    # build で作るイメージの名前。持参したファイルを docker load したときも同じ名前になる
    image: ${HANDSON_IMAGE:-handson-42tokyo:0.5}
    # 教室PCはIntel（x86_64）。Apple SiliconのMacで速く試すときは HANDSON_PLATFORM=linux/arm64
    platform: ${HANDSON_PLATFORM:-linux/amd64}
    build: .
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      # 運営がキーなしで試験だけ回すときは HANDSON_ENV_FILE=/dev/null にする
      - path: ${HANDSON_ENV_FILE:-.env}
        required: false
